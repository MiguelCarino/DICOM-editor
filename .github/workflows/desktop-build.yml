name: Build desktop app

# Builds the Carino DICOM Editor desktop app for Linux, macOS and Windows.
# One runner per OS, and each runner emits EVERY architecture for that OS: this
# app is pure Electron — no runtime dependencies, no native modules — so building
# for a second architecture is only electron-builder fetching the prebuilt
# Electron for that target triple, never compiling against the runner's own
# toolchain. This deliberately diverges from Carino DICOM, whose matrix does need
# one runner per architecture because its PyInstaller-frozen engine runs the host
# Python and cannot cross-compile; do not "unify" the two workflows on that basis.
# There is no engine to freeze here: unlike Carino DICOM, this app ships no
# Python, so the whole build is `npm install` and electron-builder. The web
# payload it packages (index.html, vendor/, fonts/, tests/dicom-forge.js …) is
# already in the checkout and is pulled in by desktop/package.json's
# extraResources, one level up from the desktop/ project directory.
#
# Artifacts are produced UNSIGNED by default; add the signing secrets below and
# the same workflow produces signed + notarized builds with no changes.
#
# Optional secrets (leave unset for unsigned builds):
#   CSC_LINK                  base64 of a code-signing cert (.p12) — macOS & Windows
#   CSC_KEY_PASSWORD          password for that .p12
#   APPLE_ID                  Apple account email (macOS notarization)
#   APPLE_APP_SPECIFIC_PASSWORD   app-specific password for that Apple ID
#   APPLE_TEAM_ID             Apple Developer Team ID

on:
  workflow_dispatch: {}
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      # Stays false so a release run reports every broken platform at once instead
      # of the first failure cancelling its siblings. Nothing partial can escape:
      # this workflow only builds (--publish never), and any future publish job
      # declaring `needs: build` is skipped when any leg fails, fail-fast or not.
      fail-fast: false
      # `expect` is the exact manifest each leg must leave in desktop/dist. It
      # exists because if-no-files-found on the upload step is a far weaker gate
      # than it looks: it fires only when NOTHING matches any pattern, so a Linux
      # leg that produced one x64 AppImage and dropped the other five files stays
      # green and the release quietly ships half an architecture. That is the one
      # failure this whole change is meant to make impossible, so it gets a check
      # of its own rather than a glob's benefit of the doubt.
      #
      # The names are NOT electron-builder's defaults. desktop/package.json sets an
      # explicit artifactName for mac and linux, and an explicit pattern is
      # "user forced": it suppresses the default's habit of dropping the arch
      # token from the x64 build, so every asset here names its architecture and
      # none of them has to be told apart by what it is missing. What the pattern
      # does NOT suppress is the per-format respelling in builder-util's
      # getArtifactArchName — x64 becomes x86_64 for AppImage and rpm but amd64
      # for deb, and arm64 becomes aarch64 for rpm alone. Hence six Linux names
      # in four spellings of two architectures. Windows has one entry because
      # nsis given both arches emits ONE installer carrying both payloads.
      matrix:
        include:
          - os: ubuntu-latest
            expect: |
              Carino-DICOM-Editor-1.0.0-x86_64.AppImage
              Carino-DICOM-Editor-1.0.0-arm64.AppImage
              Carino-DICOM-Editor-1.0.0-x86_64.rpm
              Carino-DICOM-Editor-1.0.0-aarch64.rpm
              Carino-DICOM-Editor-1.0.0-amd64.deb
              Carino-DICOM-Editor-1.0.0-arm64.deb
          - os: macos-latest
            expect: |
              Carino-DICOM-Editor-1.0.0-x64.dmg
              Carino-DICOM-Editor-1.0.0-arm64.dmg
              Carino-DICOM-Editor-1.0.0-x64.zip
              Carino-DICOM-Editor-1.0.0-arm64.zip
          - os: windows-latest
            expect: |
              Carino-DICOM-Editor-Setup-1.0.0.exe
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # electron-builder needs rpmbuild to emit the .rpm on the Linux runner.
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      # Only export the signing vars when the secret actually has a value.
      # An EMPTY CSC_LINK makes electron-builder try to sign with an empty cert
      # path (→ "desktop not a file") on macOS/Windows. Absent (not exported) =
      # unsigned build, which succeeds. Secrets are read via env, not inlined in
      # the script, so they can't leak/inject.
      - name: Configure code signing (only when secrets are set)
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            val="${!v}"
            if [ -n "$val" ]; then
              { echo "$v<<__EOF__"; printf '%s\n' "$val"; echo "__EOF__"; } >> "$GITHUB_ENV"
              echo "signing: $v is set"
            fi
          done

      # The arch flags are load-bearing: with none, electron-builder builds only
      # the runner's own architecture — that is why Carino DICOM's v1.1.0-rc02 went
      # out with an arm64 dmg and no Intel one at all. No platform flag is needed;
      # with none given electron-builder falls back to the current platform while
      # still honouring --x64/--arm64. Windows resolves to a SINGLE combined NSIS
      # installer that picks its payload at install time, which is also why the
      # win artifactName in desktop/package.json omits ${arch} on purpose — that
      # note cannot live next to the key itself, as electron-builder's config
      # schema is additionalProperties:false and rejects any comment key.
      - name: Build installers (electron-builder)
        working-directory: desktop
        run: npx --no-install electron-builder --publish never --x64 --arm64

      - name: Verify this leg produced everything it promised
        shell: bash
        run: |
          missing=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if [ -f "desktop/dist/$f" ]; then
              echo "ok      $f"
            else
              echo "MISSING $f"
              missing=1
            fi
          done <<'__EXPECT__'
          ${{ matrix.expect }}
          __EXPECT__
          # Listed to the log as well as the summary, and BEFORE the exit. A
          # missing file has two very different causes — the build dropped an
          # architecture, or this manifest transcribes a name wrongly — and
          # "MISSING x" alone cannot tell them apart. What was actually written
          # answers it immediately.
          echo "--- desktop/dist ---"
          ls -l desktop/dist || true
          {
            echo "### ${{ matrix.os }}"
            echo ""
            echo '```'
            ls -l desktop/dist
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $missing

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: carino-dicom-editor-${{ matrix.os }}
          if-no-files-found: error
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.rpm
            desktop/dist/*.deb
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
