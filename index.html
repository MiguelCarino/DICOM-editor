<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DICOM Tag Editor</title>
  <script src="https://cdn.jsdelivr.net/npm/dcmjs@0.29.8/build/dcmjs.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0a1d;
      --bg-gradient: linear-gradient(135deg, #0c0a1d 0%, #1a1333 50%, #0f1a2e 100%);
      --surface: rgba(255,255,255,0.04);
      --surface-solid: #161229;
      --surface-hover: rgba(255,255,255,0.08);
      --border: rgba(255,255,255,0.08);
      --border-glow: rgba(139,92,246,0.3);
      --text: #f0f0ff;
      --text-dim: #a0a0c0;
      --text-muted: #606080;
      
      /* Vibrant category colors */
      --cat-patient: #22d3ee;
      --cat-patient-bg: rgba(34,211,238,0.15);
      --cat-study: #a78bfa;
      --cat-study-bg: rgba(167,139,250,0.15);
      --cat-series: #f472b6;
      --cat-series-bg: rgba(244,114,182,0.15);
      --cat-image: #fb923c;
      --cat-image-bg: rgba(251,146,60,0.15);
      --cat-equipment: #4ade80;
      --cat-equipment-bg: rgba(74,222,128,0.15);
      --cat-uid: #facc15;
      --cat-uid-bg: rgba(250,204,21,0.15);
      --cat-private: #f87171;
      --cat-private-bg: rgba(248,113,113,0.15);
      --cat-other: #94a3b8;
      --cat-other-bg: rgba(148,163,184,0.15);
      
      --accent: #a78bfa;
      --accent-glow: rgba(167,139,250,0.4);
      --pink: #f472b6;
      --cyan: #22d3ee;
      
      --font: 'Space Grotesk', sans-serif;
      --mono: 'JetBrains Mono', monospace;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: var(--font);
      background: var(--bg);
      background-image: var(--bg-gradient);
      color: var(--text);
      line-height: 1.5;
    }
    
    /* Main Layout - No scroll except table */
    .app {
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100vh;
      overflow: hidden;
    }
    
    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 20px;
      background: rgba(12,10,29,0.8);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      z-index: 100;
    }
    .logo {
      font-weight: 700;
      font-size: 18px;
      background: linear-gradient(135deg, var(--cyan), var(--accent), var(--pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header-spacer { flex: 1; }
    
    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font: 500 13px var(--font);
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover {
      background: var(--surface-hover);
      border-color: var(--accent);
      box-shadow: 0 0 20px var(--accent-glow);
    }
    .btn.primary {
      background: linear-gradient(135deg, var(--accent), var(--pink));
      border: none;
      color: #fff;
      font-weight: 600;
    }
    .btn.primary:hover {
      filter: brightness(1.1);
      box-shadow: 0 0 30px var(--accent-glow);
    }
    
    /* Main Content */
    .main {
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 16px;
      padding: 16px 20px;
      overflow: hidden;
      min-height: 0;
    }
    @media (max-width: 1000px) {
      .main { grid-template-columns: 1fr; }
      .sidebar { display: none; }
    }
    
    /* Left Panel */
    .left-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
      overflow: hidden;
    }
    
    /* Top Bar (Pills + Actions) */
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 12px;
      color: var(--text-dim);
    }
    .pill.glow {
      border-color: var(--accent);
      box-shadow: 0 0 15px var(--accent-glow);
    }
    
    /* UID Pattern Display */
    .uid-pattern {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: var(--cat-uid-bg);
      border: 1px solid rgba(250,204,21,0.3);
      border-radius: 8px;
      font-size: 12px;
    }
    .uid-pattern-label {
      color: var(--cat-uid);
      font-weight: 600;
    }
    .uid-pattern-value {
      font-family: var(--mono);
      color: var(--text);
      background: rgba(0,0,0,0.3);
      padding: 2px 8px;
      border-radius: 4px;
    }
    .uid-pattern input {
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(250,204,21,0.3);
      border-radius: 4px;
      padding: 4px 8px;
      color: var(--text);
      font: 12px var(--mono);
      width: 200px;
    }
    .uid-pattern input:focus {
      outline: none;
      border-color: var(--cat-uid);
    }
    
    /* Filters Row */
    .filters-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .filter-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      font: 500 11px var(--font);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-btn:hover {
      border-color: var(--border-glow);
      color: var(--text-dim);
    }
    .filter-btn.active {
      color: var(--text);
      border-color: var(--accent);
      background: rgba(167,139,250,0.1);
    }
    .filter-btn .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .filter-btn[data-cat="all"] .dot { background: linear-gradient(135deg, var(--cyan), var(--pink)); }
    .filter-btn[data-cat="patient"] .dot { background: var(--cat-patient); }
    .filter-btn[data-cat="study"] .dot { background: var(--cat-study); }
    .filter-btn[data-cat="series"] .dot { background: var(--cat-series); }
    .filter-btn[data-cat="image"] .dot { background: var(--cat-image); }
    .filter-btn[data-cat="equipment"] .dot { background: var(--cat-equipment); }
    .filter-btn[data-cat="uid"] .dot { background: var(--cat-uid); }
    .filter-btn[data-cat="private"] .dot { background: var(--cat-private); }
    .filter-btn[data-cat="other"] .dot { background: var(--cat-other); }
    
    /* Search */
    .search-box {
      position: relative;
      flex-shrink: 0;
    }
    .search-box input {
      width: 220px;
      padding: 8px 12px 8px 36px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font: 13px var(--font);
    }
    .search-box input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 15px var(--accent-glow);
    }
    .search-box input::placeholder { color: var(--text-muted); }
    .search-box svg {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: var(--text-muted);
    }
    
    /* Table Container - THIS SCROLLS */
    .table-wrap {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    table { width: 100%; border-collapse: collapse; }
    thead { position: sticky; top: 0; z-index: 5; }
    thead th {
      background: var(--surface-solid);
      padding: 12px 14px;
      font: 600 10px var(--font);
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    tbody tr {
      transition: background 0.15s;
    }
    tbody tr:hover {
      background: var(--surface-hover);
    }
    tbody td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
      font-size: 13px;
    }
    
    /* Tag cell */
    .tag-cell {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tag-code {
      font: 500 11px var(--mono);
      color: var(--text-dim);
      background: rgba(0,0,0,0.3);
      padding: 3px 8px;
      border-radius: 4px;
    }
    .tag-cat {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .tag-cat[data-cat="patient"] { background: var(--cat-patient); box-shadow: 0 0 8px var(--cat-patient); }
    .tag-cat[data-cat="study"] { background: var(--cat-study); box-shadow: 0 0 8px var(--cat-study); }
    .tag-cat[data-cat="series"] { background: var(--cat-series); box-shadow: 0 0 8px var(--cat-series); }
    .tag-cat[data-cat="image"] { background: var(--cat-image); box-shadow: 0 0 8px var(--cat-image); }
    .tag-cat[data-cat="equipment"] { background: var(--cat-equipment); box-shadow: 0 0 8px var(--cat-equipment); }
    .tag-cat[data-cat="uid"] { background: var(--cat-uid); box-shadow: 0 0 8px var(--cat-uid); }
    .tag-cat[data-cat="private"] { background: var(--cat-private); box-shadow: 0 0 8px var(--cat-private); }
    .tag-cat[data-cat="other"] { background: var(--cat-other); }
    
    /* Description cell */
    .desc-cell {
      color: var(--text);
      font-weight: 500;
    }
    .desc-unknown {
      color: var(--text-muted);
      font-style: italic;
    }
    
    /* VR badge */
    .vr-badge {
      font: 500 10px var(--mono);
      padding: 3px 6px;
      background: rgba(0,0,0,0.4);
      border-radius: 4px;
      color: var(--text-dim);
    }
    
    /* Value input */
    .val-input {
      width: 100%;
      padding: 8px 10px;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font: 13px var(--font);
      transition: all 0.2s;
    }
    .val-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 15px var(--accent-glow);
    }
    .val-input:disabled {
      background: rgba(0,0,0,0.2);
      color: var(--text-muted);
      cursor: not-allowed;
    }
    .val-input.binary {
      font-style: italic;
      color: var(--text-muted);
    }
    
    /* Compare highlighting */
    tr.cmp-match td { background: rgba(74,222,128,0.1); }
    tr.cmp-diff td { background: rgba(251,146,60,0.1); }
    
    /* Actions Row */
    .actions-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .actions-spacer { flex: 1; }
    
    /* Right Sidebar */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow: hidden;
    }
    
    /* Card style */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
    }
    .card-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }
    
    /* Drop Zone */
    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .drop-zone:hover, body.dragging .drop-zone {
      border-color: var(--accent);
      background: rgba(167,139,250,0.05);
      box-shadow: 0 0 30px var(--accent-glow);
    }
    .drop-zone h4 {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
      background: linear-gradient(135deg, var(--cyan), var(--pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .drop-zone p {
      font-size: 11px;
      color: var(--text-muted);
    }
    
    /* Image Preview */
    .preview-box {
      position: relative;
      aspect-ratio: 1;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      display: none;
    }
    .preview-box.visible { display: block; }
    .preview-box canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .preview-box::after {
      content: '🔍 Click to enlarge';
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 10px;
      color: var(--text-dim);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .preview-box:hover::after { opacity: 1; }
    
    /* Fullscreen Overlay */
    .fullscreen-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      display: none;
      place-items: center;
      z-index: 1000;
      cursor: pointer;
    }
    .fullscreen-overlay.visible {
      display: grid;
    }
    .fullscreen-overlay canvas {
      max-width: 95vw;
      max-height: 95vh;
      border-radius: 8px;
    }
    .fullscreen-hint {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.1);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      color: var(--text-dim);
    }
    
    /* Compare Panel */
    .compare-drop {
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }
    .compare-drop:hover {
      border-color: var(--pink);
      background: rgba(244,114,182,0.05);
    }
    .compare-legend {
      display: flex;
      gap: 12px;
      margin-top: 10px;
      font-size: 10px;
      color: var(--text-muted);
    }
    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 4px;
    }
    .legend-dot.match { background: var(--cat-equipment); }
    .legend-dot.diff { background: var(--cat-image); }
    .compare-status {
      margin-top: 8px;
      font-size: 11px;
      color: var(--text-dim);
    }
    .view-toggle {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .view-toggle label {
      font-size: 11px;
      color: var(--text-dim);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .view-toggle input { accent-color: var(--accent); }
    
    /* Log */
    .log-area {
      max-height: 120px;
      overflow-y: auto;
      font: 10px var(--mono);
      background: rgba(0,0,0,0.4);
      padding: 8px;
      border-radius: 6px;
      color: var(--text-muted);
      white-space: pre-wrap;
    }
    
    .social-btn {
      width: 40px; height: 40px; align-items: center; justify-content: center;
      background: rgba(125,125,125,0.1); border-radius: 10px; color: var(--fg-secondary);
      border: 1px solid transparent; transition: 0.2s; margin: 6px ;
    }

    .social-btn:hover { transform: translateY(-3px); color: var(--accent); }
    .card.disabled { opacity: 0.5; pointer-events: none; }
    .hidden { display: none !important; }
    
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(167,139,250,0.3); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(167,139,250,0.5); }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="logo">DICOM Editor</div>
      <div class="header-spacer"></div>
        <div class="brand-links">
          <a href="https://github.com/MiguelCarino/DICOM-editor" target="_blank" class="social-btn" aria-label="GitHub">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>
          </a>
          <a href="https://www.linkedin.com/in/miguelcarino94/" target="_blank" class="social-btn" aria-label="LinkedIn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path><rect x="2" y="9" width="4" height="12"></rect><circle cx="4" cy="4" r="2"></circle></svg>
          </a>
          <!--<a href="https://youtube.com" target="_blank" class="social-btn" aria-label="YouTube">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.33 29 29 0 0 0-.46-5.33z"></path><polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"></polygon></svg>
          </a>-->
        </div>
    </header>

    <div class="main">
      <div class="left-panel">
        <div class="top-bar" id="topBar">
          <div class="pill" id="fileNamePill">No file loaded</div>
          <div class="pill" id="fileCountPill">0 files</div>
          
          <div class="uid-pattern" id="uidPattern" style="display:none">
            <span class="uid-pattern-label">UID Pattern:</span>
            <input type="text" id="uidPrefixInput" placeholder="prefix..." />
            <span class="uid-pattern-value" id="uidPatternDisplay">—</span>
            <button class="btn" id="applyPrefixBtn" style="padding:4px 10px;font-size:11px;">Apply</button>
          </div>
        </div>

        <div class="filters-row">
          <button class="filter-btn active" data-cat="all"><span class="dot"></span>All</button>
          <button class="filter-btn" data-cat="patient"><span class="dot"></span>Patient</button>
          <button class="filter-btn" data-cat="study"><span class="dot"></span>Study</button>
          <button class="filter-btn" data-cat="series"><span class="dot"></span>Series</button>
          <button class="filter-btn" data-cat="image"><span class="dot"></span>Image</button>
          <button class="filter-btn" data-cat="equipment"><span class="dot"></span>Equipment</button>
          <button class="filter-btn" data-cat="uid"><span class="dot"></span>UIDs</button>
          <button class="filter-btn" data-cat="private"><span class="dot"></span>Private</button>
          <button class="filter-btn" data-cat="other"><span class="dot"></span>Other</button>
          
          <div style="flex:1"></div>
          
          <div class="search-box">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            <input type="text" id="searchInput" placeholder="Search..." />
          </div>
        </div>

        <div class="table-wrap" id="tableWrap">
          <table>
            <thead>
              <tr>
                <th style="width:140px">Tag</th>
                <th>Description</th>
                <th style="width:50px">VR</th>
                <th style="width:40%">Value</th>
              </tr>
            </thead>
            <tbody id="tagBody"></tbody>
          </table>
        </div>

        <div class="actions-row">
          <button id="anonymizeBtn" class="btn">Anonymize All</button>
          <button id="randomizeBtn" class="btn">Randomize All</button>
          <div class="actions-spacer"></div>
          <button id="downloadAllBtn" class="btn primary hidden">⬇ Download All</button>
          <div id="batchButtons" class="hidden"></div>
        </div>
      </div>

      <div class="sidebar">
      <button id="browseBtn" class="btn">Choose Files</button>
      <input id="fileInput" type="file" multiple accept=".dcm,.dicom" hidden />
        <div class="card">
          <div class="card-title">Load Files</div>
          <div class="drop-zone" id="dropZone">
            <h4>Drop DICOM files</h4>
            <p>or click to browse</p>
          </div>
        </div>

        <div class="card" id="previewCard" style="display:none">
          <div class="card-title">Preview</div>
          <div class="preview-box visible" id="previewBox">
            <canvas id="preview"></canvas>
          </div>
        </div>

        <div class="card" id="compareCard">

// ============ UTILITIES ============
function isBinaryVR(vr) { return ['OB','OW','OF','UN','OD','OL'].includes(vr); }
function isReadOnly(tag, vr) {
  const t = String(tag).toLowerCase();
  if (t === 'x7fe00010' || t === '7fe00010') return true;
  if (vr === 'SQ') return true;
  return isBinaryVR(vr);
}
function fmtTag(t) {
  const s = t.startsWith('x') ? t.slice(1) : t;
  return '(' + s.slice(0,4).toUpperCase() + ',' + s.slice(4,8).toUpperCase() + ')';
}
function elToString(el) {
  if (!el) return '';
  if (el.InlineBinary) return '<binary>';
  const v = el.Value;
  if (v == null) return '';
  if (Array.isArray(v)) return v.map(x => x == null ? '' : String(x)).join('\\');
  return String(v);
}
function parseByVR(vr, str) {
  if (str == null) return [];
  const parts = String(str).split('\\').map(s => s.trim());
  switch (vr) {
    case 'US': case 'UL': case 'SS': case 'SL': case 'FL': case 'FD':
      return parts.map(x => { const n = Number(x); return Number.isFinite(n) ? n : 0; });
    default: return parts;
  }
}

// Improved Description Lookup
function descFor(tag) {
  // Normalize tag: 'x00100010'
  const t = tag.startsWith('x') ? tag.slice(1) : tag;
  const k = 'x' + t.toLowerCase();
  
  // 1. Manual Dictionary
  if (TAG_DICT[k]) return TAG_DICT[k].desc;
  
  // 2. dcmjs Dictionary Fallback
  // Try to find the tag in the library's internal dictionary
  // dcmjs keys are typically '00100010' (no 'x', lowercase)
  const entry = DicomMetaDictionary.dictionary[t.toLowerCase()];
  
  if (entry && entry.name) {
    // Convert 'PatientName' -> 'Patient Name'
    return entry.name.replace(/([A-Z])/g, ' $1').trim();
  }
  
  return null;
}

function catFor(tag, vr) {
  const t = tag.startsWith('x') ? tag.slice(1) : tag;
  const k = 'x' + t.toLowerCase();
  
  // 1. Manual Category
  if (TAG_DICT[k]) return TAG_DICT[k].cat;

  // 2. VR check
  if (vr === 'UI') return 'uid';

  // 3. Heuristic based on Group Number
  const group = parseInt(t.slice(0,4), 16);
  if (group % 2 === 1) return 'private'; // Odd groups are private
  
  // Standard Groups
  if (group === 0x0008) return 'study'; // or equipment/series/image mixed
  if (group === 0x0010) return 'patient';
  if (group === 0x0018) return 'series'; // or image/equipment
  if (group === 0x0020) return 'image'; // Relationship
  if (group === 0x0028) return 'image'; // Presentation
  if (group === 0x7FE0) return 'image'; // Pixel Data
  
  return 'other';
}

// ============ UID PATTERN DETECTION ============
function detectUIDPattern() {
  const uids = [];
  for (const f of files) {
    walkEls(f.dict, (t, el) => {
      if (el.vr === 'UI' && el.Value) {
        el.Value.forEach(v => { if (v) uids.push(String(v)); });
      }
    });
  }
  if (!uids.length) {
    uidPattern.style.display = 'none';
    return;
  }
  
  // Find common prefix
  let p = uids[0] || '';
  for (let i = 1; i < uids.length; i++) {
    let j = 0;
    while (j < p.length && j < uids[i].length && p[j] === uids[i][j]) j++;
    p = p.slice(0, j);
    if (!p) break;
  }
  const k = p.lastIndexOf('.');
  sharedUIDPrefix = k > 0 ? p.slice(0, k) : p;
  
  // Detect pattern (show what varies)
  if (sharedUIDPrefix && uids.length > 0) {
    const suffixes = uids.map(u => u.slice(sharedUIDPrefix.length)).filter(s => s);
    const uniqueSuffixes = [...new Set(suffixes)];
    detectedPattern = `${sharedUIDPrefix}.*`;
    uidPatternDisplay.textContent = detectedPattern;
    uidPrefixInput.value = sharedUIDPrefix;
    uidPattern.style.display = 'flex';
  } else {
    uidPattern.style.display = 'none';
  }
}

function applyPrefixToAll(newP) {
  if (!/^[0-9]+(\.[0-9]+)*$/.test(newP)) { alert('Invalid UID prefix'); return; }
  const oldP = sharedUIDPrefix;
  for (const f of files) {
    walkEls(f.dict, (t, el) => {
      if (el.vr !== 'UI' || !el.Value) return;
      el.Value = el.Value.map(v => {
        const s = String(v || '');
        if (!s) return s;
        if (oldP && s.startsWith(oldP + '.')) return newP + s.slice(oldP.length);
        const c = s.lastIndexOf('.');
        return c > 0 ? newP + s.slice(c) : newP;
      });
    });
  }
  pendingEdits.clear();
  if (dict) {
    Object.entries(dict).forEach(([t, el]) => {
      if (el && el.vr !== 'SQ' && !isBinaryVR(el.vr)) {
        pendingEdits.set(t, { vr: el.vr, valueString: elToString(el) });
      }
    });
  }
  sharedUIDPrefix = newP;
  uidPrefixInput.value = newP;
  uidPatternDisplay.textContent = `${newP}.*`;
  renderTable();
  log(`Applied UID prefix: ${newP}`);
}

// ============ RENDERING ============
function renderTable() {
  if (!dict && !compareDict) { tagBody.innerHTML = ''; return; }
  const isPrimary = activeView === 'primary' || !compareDict;
  const mainDict = isPrimary ? dict : compareDict;
  const otherDict = isPrimary ? compareDict : dict;
  if (!mainDict) { tagBody.innerHTML = ''; return; }

  const entries = Object.entries(mainDict).filter(([t]) => t.startsWith('x') || /^[0-9a-f]{8}$/i.test(t));
  entries.sort(([a],[b]) => a.localeCompare(b));
  const q = searchQuery.toLowerCase();
  const rows = [];

  for (const [tag, el] of entries) {
    const vr = el.vr || '';
    const desc = descFor(tag);
    const cat = catFor(tag, vr);
    if (activeCat !== 'all' && cat !== activeCat) continue;
    
    let valStr = isPrimary && pendingEdits.has(tag) ? pendingEdits.get(tag).valueString : elToString(el);
    
    if (q) {
      const searchable = `${tag} ${fmtTag(tag)} ${desc || ''} ${valStr}`.toLowerCase();
      if (!searchable.includes(q)) continue;
    }
    
    let trClass = '';
    if (otherDict && files.length <= 1) {
      const cmpEl = otherDict[tag];
      if (cmpEl) trClass = elToString(cmpEl) === valStr ? 'cmp-match' : 'cmp-diff';
    }
    
    const tr = document.createElement('tr');
    if (trClass) tr.classList.add(trClass);
    tr.innerHTML = `
      <td>
        <div class="tag-cell">
          <span class="tag-cat" data-cat="${cat}"></span>
          <span class="tag-code">${fmtTag(tag)}</span>
        </div>
      </td>
      <td><span class="${desc ? 'desc-cell' : 'desc-cell desc-unknown'}">${desc || 'Unknown tag'}</span></td>
      <td><span class="vr-badge">${vr}</span></td>
      <td></td>
    `;
    
    const inp = document.createElement('input');
    inp.className = 'val-input' + (el.InlineBinary || isBinaryVR(vr) ? ' binary' : '');
    inp.value = valStr;
    const ro = isReadOnly(tag, vr) || !isPrimary;
    inp.disabled = ro;
    if (!ro) {
      inp.addEventListener('input', () => {
        pendingEdits.set(tag, { vr, valueString: inp.value });
        showDownload();
      });
    }
    tr.lastElementChild.appendChild(inp);
    rows.push(tr);
  }
  
  tagBody.replaceChildren(...rows);
  showDownload();
  detectUIDPattern();
  updateCompare();
}

function showDownload() {
  const has = files.length > 0;
  downloadAllBtn.classList.toggle('hidden', !has);
  batchButtonsContainer.classList.toggle('hidden', !has || files.length <= 10);

function rebuildBatch() {
  batchButtonsContainer.innerHTML = '';
  const sz = 10;
  for (let i = 0; i < files.length; i += sz) {
    const end = Math.min(i + sz, files.length);

}

function updateCompare() {
  if (files.length <= 1) {
    compareCard.classList.remove('disabled');
    viewCompareRadio.disabled = !compareDict;
    compareStatus.textContent = compareDict ? `Comparing: ${compareName}` : 'No compare file loaded';

    viewPrimaryRadio.checked = true;
    viewCompareRadio.disabled = true;
  }
}

// ============ WALK & NORMALIZE ============
function walkEls(node, fn) {
  if (!node || typeof node !== 'object') return;
  for (const [t, el] of Object.entries(node)) {
    if (!el || typeof el !== 'object') continue;
    fn(t, el, node);
    if (el.vr === 'SQ' && Array.isArray(el.Value)) {
      el.Value.forEach(item => walkEls(item, fn));
    }
  }
}

function b64ToAB(b) {
  b = b.replace(/-/g, '+').replace(/_/g, '/');
  const pad = b.length % 4;
  if (pad) b += '='.repeat(4 - pad);
  const bin = atob(b);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}

function normBin(node) {
  const bins = new Set(['OB','OW','OF','UN','OD','OL']);
  walkEls(node, (t, el) => {
    if (typeof el.InlineBinary === 'string') {
      try { el.Value = [b64ToAB(el.InlineBinary)]; delete el.InlineBinary; } catch (e) {}
    }
    const isPx = t.toLowerCase() === 'x7fe00010' || t === '7fe00010';
    if (isPx || bins.has(el.vr)) {
      let arr = el.Value || [];
      if (!Array.isArray(arr)) arr = [arr];
      el.Value = arr.map(v => 
        v instanceof ArrayBuffer ? v : 
        ArrayBuffer.isView(v) ? v.buffer.slice(v.byteOffset, v.byteOffset + v.byteLength) : 
        null
      ).filter(Boolean);
    }
  });
}

function ensureMeta(denat, fm) {
  const m = fm && typeof fm === 'object' ? {...fm} : {};
  const sopC = denat['x00080016']?.Value?.[0];
  const sopI = denat['x00080018']?.Value?.[0];
  if (!m.FileMetaInformationVersion) m.FileMetaInformationVersion = { vr:'OB', Value:[new Uint8Array([0,1]).buffer] };
  if (sopC) m.MediaStorageSOPClassUID = { vr:'UI', Value:[sopC] };
  if (sopI) m.MediaStorageSOPInstanceUID = { vr:'UI', Value:[sopI] };
  if (!m.TransferSyntaxUID) m.TransferSyntaxUID = { vr:'UI', Value:['1.2.840.10008.1.2.1'] };
  if (!m.ImplementationClassUID) m.ImplementationClassUID = { vr:'UI', Value:['1.2.826.0.1.3680043.10.743'] };
  return m;
}

// ============ PREVIEW WITH FULLSCREEN ============
function drawPreview(d) {
  const rows = d['x00280010']?.Value?.[0];
  const cols = d['x00280011']?.Value?.[0];
  const spp = d['x00280002']?.Value?.[0] || 1;
  const pi = d['x00280004']?.Value?.[0];
  const ba = d['x00280100']?.Value?.[0] || 16;
  const bs = d['x00280101']?.Value?.[0] || ba;
  const hb = d['x00280102']?.Value?.[0] || bs - 1;
  const pr = d['x00280103']?.Value?.[0] || 0;
  const wc = d['x00281050']?.Value?.[0];
  const ww = d['x00281051']?.Value?.[0];
  
  if (!rows || !cols || spp !== 1 || !/^MONOCHROME[12]$/i.test(pi || '')) {
    previewCard.style.display = 'none';
    return;
  }
  
  const px = d['x7fe00010'] || d['7fe00010'];
  if (!px?.Value?.[0] || !(px.Value[0] instanceof ArrayBuffer)) {
    previewCard.style.display = 'none';
    return;
  }
  
  let data = ba === 16 ? new (pr ? Int16Array : Uint16Array)(px.Value[0]) : 
             ba === 8 ? new Uint8Array(px.Value[0]) : null;
  if (!data) { previewCard.style.display = 'none'; return; }
  
  // Draw to preview canvas
  previewCanvas.width = cols;
  previewCanvas.height = rows;
  const ctx = previewCanvas.getContext('2d');
  const img = ctx.createImageData(cols, rows);
  const out = img.data;
  
  const mask = bs < 16 ? (1 << bs) - 1 : 0xFFFF;
  const shift = hb - bs + 1;
  
  for (let i = 0; i < rows * cols; i++) {
    let v = data[i];
    if (ba === 16) {
      if (!pr) v >>>= 0;
      if (shift > 0) v >>>= shift;
      if (bs < 16) v &= mask;
      if (pr) {
        const sb = 1 << (bs - 1);
        if (v & sb) v -= sb << 1;
      }
    }
    let g = v;
    if (ww && wc) {
      const lo = wc - 0.5 - (ww - 1) / 2;
      const hi = wc - 0.5 + (ww - 1) / 2;
      g = v <= lo ? 0 : v > hi ? 255 : Math.round(((v - lo) / (hi - lo)) * 255);
    } else {
      const mx = (1 << bs) - 1;
      g = Math.round((v / mx) * 255);
    }
    const p = i * 4;
    out[p] = out[p + 1] = out[p + 2] = g;
    out[p + 3] = 255;
  }
  
  ctx.putImageData(img, 0, 0);
  previewCard.style.display = 'block';
  
  // Store for fullscreen
  previewImageData = { width: cols, height: rows, data: img };
}

function showFullscreen() {
  if (!previewImageData) return;
  fullscreenCanvas.width = previewImageData.width;
  fullscreenCanvas.height = previewImageData.height;
  const ctx = fullscreenCanvas.getContext('2d');
  ctx.putImageData(previewImageData.data, 0, 0);
  fullscreenOverlay.classList.add('visible');
}

function hideFullscreen() {
  fullscreenOverlay.classList.remove('visible');
}

// ============ ANONYMIZE & RANDOMIZE ============
const PHI = ['x00100010','x00100020','x00100030','x00100040','x00101010','x00101020','x00101030','x00102160','x00104000','x00080050','x00080080','x00080081','x00080090','x00081010','x00081030','x0008103e','x00081040','x00081050','x00081070','x00081090','x00181000','x00181020','x00181030','x00200010'];
const DATES = ['x00080020','x00080021','x00080022','x00080023'];
const TIMES = ['x00080030','x00080031','x00080032','x00080033'];

function nowDA() { const t = new Date(); return `${t.getFullYear()}${String(t.getMonth()+1).padStart(2,'0')}${String(t.getDate()).padStart(2,'0')}`; }
function nowTM() { const t = new Date(); return `${String(t.getHours()).padStart(2,'0')}${String(t.getMinutes()).padStart(2,'0')}${String(t.getSeconds()).padStart(2,'0')}`; }
function randDigits(n) { let s = ''; for (let i = 0; i < n; i++) s += Math.floor(Math.random() * 10); return s; }
function randFrom(a) { return a[Math.floor(Math.random() * a.length)]; }
function setTag(d, t, vr, val) { d[t] = { vr, Value: Array.isArray(val) ? val : [val] }; }
function remPrivate(node) {
  walkEls(node, (t, el, parent) => {
    const g = parseInt((t.startsWith('x') ? t.slice(1) : t).slice(0,4), 16);
    if (g % 2 === 1) delete parent[t];
  });
}
function newUID() {
  const a = new Uint8Array(16);
  crypto.getRandomValues(a);
  a[6] = (a[6] & 0x0f) | 0x40;
  a[8] = (a[8] & 0x3f) | 0x80;
  let n = 0n;
  for (const b of a) n = (n << 8n) + BigInt(b);
  return `2.25.${n.toString(10)}`;
}

function anonymize(d) {
  remPrivate(d);
  for (const t of PHI) if (d[t]) setTag(d, t, d[t].vr || 'LO', 'ANON');
  setTag(d, 'x00100010', 'PN', 'ANON^PATIENT');
  setTag(d, 'x00100020', 'LO', 'ANON');
  setTag(d, 'x00100040', 'CS', 'O');
  setTag(d, 'x00101010', 'AS', '000Y');
  for (const t of DATES) if (d[t]) setTag(d, t, 'DA', nowDA());
  for (const t of TIMES) if (d[t]) setTag(d, t, 'TM', nowTM());
}

function randomize(d) {
  setTag(d, 'x00100010', 'PN', `${randFrom(['DOE','SMITH','GARCIA','LEE','WANG'])}^${randFrom(['JOHN','MARIA','ALICE','JAMES'])}`);
  setTag(d, 'x00100020', 'LO', randDigits(8));
  setTag(d, 'x00100030', 'DA', `${1950 + Math.floor(Math.random() * 60)}${String(1 + Math.floor(Math.random() * 12)).padStart(2,'0')}${String(1 + Math.floor(Math.random() * 28)).padStart(2,'0')}`);
  setTag(d, 'x00100040', 'CS', randFrom(['M','F','O']));
  setTag(d, 'x00101010', 'AS', `${String(Math.floor(Math.random() * 90) + 1).padStart(3,'0')}Y`);
  for (const t of DATES) setTag(d, t, 'DA', nowDA());
  for (const t of TIMES) setTag(d, t, 'TM', nowTM());
  setTag(d, 'x00200010', 'SH', randDigits(6));
  setTag(d, 'x00080050', 'SH', randDigits(9));
}

function remapUIDs() {
  const map = new Map();
  for (const f of files) {
    walkEls(f.dict, (t, el) => {
      if (el.vr !== 'UI' || !el.Value) return;
      el.Value = el.Value.map(v => {
        const s = String(v || '').trim();
        if (!s) return s;
        if (!map.has(s)) map.set(s, newUID());
        return map.get(s);
      });
    });
  }
}

function syncToUI() {
  pendingEdits.clear();
  if (dict) {
    Object.entries(dict).forEach(([t, el]) => {
      if (el && el.vr !== 'SQ' && !isBinaryVR(el.vr)) {
        pendingEdits.set(t, { vr: el.vr, valueString: elToString(el) });
      }
    });
  }
  activeView = 'primary';
  viewPrimaryRadio.checked = true;
  renderTable();
  if (dict) drawPreview(dict);
}

// ============ FILE HANDLING ============
async function handleFiles(list) {
  files = [];
  dict = meta = null;
  pendingEdits.clear();
  tagBody.innerHTML = '';
  previewCard.style.display = 'none';
  logArea.textContent = '';
  logCard.style.display = 'none';
  compareDict = compareName = null;
  previewImageData = null;
  
  const arr = Array.from(list || []);
  if (!arr.length) return;
  
  log(`Loading ${arr.length} file(s)...`);
  
  for (const file of arr) {
    try {
      const buf = await file.arrayBuffer();
      const msg = DicomMessage.readFile(buf);
      files.push({ name: file.name, dict: msg.dict, meta: msg.meta || {} });
      log(`✓ ${file.name}`);
    } catch (e) {
      log(`✗ ${file.name}: ${e.message || e}`);
    }
  }
  
  if (!files.length) {
    alert('No valid DICOM files.');
    return;
  }
  
  dict = files[0].dict;
  meta = files[0].meta;
  
  fileNamePill.textContent = files.length === 1 ? files[0].name : `${files[0].name} (+${files.length - 1})`;
  fileCountPill.textContent = `${files.length} file${files.length > 1 ? 's' : ''}`;
  
  syncToUI();
}

async function handleCompare(file) {
  if (!file || !files.length) return;
  if (files.length > 1) {
    alert('Compare only available for single file.');
    return;
  }
  try {
    const buf = await file.arrayBuffer();
    const msg = DicomMessage.readFile(buf);
    compareDict = msg.dict;
    compareName = file.name;
    log(`Compare loaded: ${compareName}`);
    compareStatus.textContent = `Comparing: ${compareName}`;
    viewCompareRadio.disabled = false;
    renderTable();
  } catch (e) {
    log(`Compare failed: ${e.message || e}`);
    alert('Failed to load compare file.');
  }
}

function downloadRange(start, end) {
  if (!files.length) return;
  for (let i = start; i < end; i++) {
    const f = files[i];
    try {
      const d = typeof structuredClone === 'function' ? structuredClone(f.dict) : {...f.dict};
      pendingEdits.forEach(({ vr, valueString }, t) => {
        if (!isReadOnly(t, vr)) d[t] = { vr, Value: parseByVR(vr, valueString) };
      });
      const m = ensureMeta(d, f.meta);
      normBin(d);
      normBin(m);
      const dd = new DicomDict(m);
      dd.dict = d;
      const out = dd.write();
      const blob = new Blob([out.buffer || out], { type: 'application/dicom' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${f.name.replace(/\.[^.]+$/, '')}.edited.dcm`;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
      log(`⬇ ${f.name}`);
    } catch (e) {
      log(`✗ Download ${f.name}: ${e.message || e}`);
    }
  }
}

// ============ EVENTS ============
window.addEventListener('dragover', e => { e.preventDefault(); body.classList.add('dragging'); });
window.addEventListener('dragleave', () => body.classList.remove('dragging'));
window.addEventListener('drop', e => {
  e.preventDefault();
  body.classList.remove('dragging');
  if (e.dataTransfer?.files?.length) handleFiles(e.dataTransfer.files);
});

dropZone.addEventListener('click', () => fileInput.click());
browseBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => { if (e.target.files?.length) handleFiles(e.target.files); });

downloadAllBtn.addEventListener('click', () => downloadRange(0, files.length));

applyPrefixBtn.addEventListener('click', () => {
  const p = uidPrefixInput.value.trim();
  if (p && p !== sharedUIDPrefix) applyPrefixToAll(p);
});

anonymizeBtn.addEventListener('click', () => {
  files.forEach(f => anonymize(f.dict));
  remapUIDs();
  syncToUI();
  log('Anonymized all files');
});

randomizeBtn.addEventListener('click', () => {
  files.forEach(f => randomize(f.dict));
  remapUIDs();
  syncToUI();
  log('Randomized all files');
});

compareDropZone.addEventListener('click', () => {
  if (files.length > 1) { alert('Compare only for single file.'); return; }
  compareFileInput.click();
});
compareFileInput.addEventListener('change', e => {
  if (e.target.files?.[0]) handleCompare(e.target.files[0]);
});
compareDropZone.addEventListener('dragover', e => { e.preventDefault(); e.stopPropagation(); });
compareDropZone.addEventListener('drop', e => {
  e.preventDefault();
  e.stopPropagation();
  if (e.dataTransfer?.files?.[0]) handleCompare(e.dataTransfer.files[0]);
});

viewPrimaryRadio.addEventListener('change', () => {
  if (viewPrimaryRadio.checked) { activeView = 'primary'; renderTable(); }
});
viewCompareRadio.addEventListener('change', () => {
  if (viewCompareRadio.checked && compareDict) { activeView = 'compare'; renderTable(); }
});

searchInput.addEventListener('input', e => { searchQuery = e.target.value; renderTable(); });

filterBtns.forEach(btn => btn.addEventListener('click', () => {
  filterBtns.forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeCat = btn.dataset.cat;
  renderTable();
}));

// Preview fullscreen
previewBox.addEventListener('click', showFullscreen);
fullscreenOverlay.addEventListener('click', hideFullscreen);
</script>
